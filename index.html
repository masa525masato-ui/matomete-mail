<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まとめてメール</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#16202e;--sub:#5d6b7e;--line:#d9e0e8;--sel:#e3edfb;--acc:#2456c9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111821;--panel:#1a2430;--ink:#e8edf3;--sub:#98a6b8;--line:#2b3846;--sel:#223652;--acc:#7aa5ff}}
:root[data-theme="dark"]{--bg:#111821;--panel:#1a2430;--ink:#e8edf3;--sub:#98a6b8;--line:#2b3846;--sel:#223652;--acc:#7aa5ff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:minmax(0,1fr);height:100%;gap:1px;background:var(--line)}
.app>*{background:var(--panel);min-height:0;overflow:auto}
.side{padding:16px 12px}
.app>.side{position:fixed;top:0;left:0;bottom:0;width:260px;max-width:85vw;z-index:20;transform:translateX(-102%);visibility:hidden;transition:transform .2s,visibility .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
body.menu-open .app>.side{transform:none;visibility:visible;box-shadow:4px 0 24px rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15;display:none}
body.menu-open .scrim{display:block}
#menuBtn{display:flex;align-items:center;padding:6px 9px}
.head{flex-basis:100%;display:flex;align-items:center;gap:10px}
.cur{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.nav svg{flex:none}
#emptyTrash{font-size:13px}
.seg{display:flex;gap:6px}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lock form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(360px,100%)}
.lock h2{margin:0 0 6px;font-size:19px}
.lock label{display:block;margin:12px 0 4px;font-size:13px;color:var(--sub)}
.lock input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.lock .go{margin-top:8px;width:100%;background:var(--acc);color:var(--bg);border-color:var(--acc);padding:9px}
.err{color:#c0392b;font-size:13px;min-height:1.4em;margin:8px 0 0}
body.locked .app,body.locked .scrim{display:none}
body:not(.locked) .lock{display:none}
.home{text-align:center;width:min(380px,100%)}
.home h1{font-size:30px;margin:0 0 6px}
.tag2{margin:0 0 22px;color:var(--sub)}
.peek{display:grid;gap:6px;width:min(260px,100%);margin:0 auto 24px}
.peek i{display:block;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c)}
.peek i:nth-child(2){margin-left:16px}.peek i:nth-child(3){margin-right:16px}.peek i:nth-child(4){margin-left:8px}
.hbtns{display:grid;gap:8px}
.hbtns .chip{width:100%;padding:11px;font-size:15px}
.who{margin:-10px 8px 14px;font-size:12px;color:var(--sub);overflow-wrap:anywhere}
.arow{display:flex;align-items:center;gap:2px}
.arow .nav{flex:1;min-width:0}
.kebab{flex:none;border:0;background:none;border-radius:8px;padding:8px 6px;color:var(--sub);display:flex}
.kebab:hover{background:var(--bg);color:var(--ink)}
.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.swc{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.swc[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
#accCol{width:34px;height:28px;padding:0 !important;border:1px solid var(--line);border-radius:6px;background:none}
.danger{color:#c0392b;border-color:#c0392b}
.tr{margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);max-width:38em}
.trbar{display:flex;gap:8px;align-items:center}
.trbar select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
.trout{margin-top:12px;padding:12px 14px;background:var(--sel);border-radius:8px;white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.swrap{position:relative;overflow:hidden}
.swrap .mail{position:relative;z-index:1;background:var(--panel);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swrap .mail:hover{background:var(--bg)}
.swrap .mail[aria-current="true"]{background:var(--sel)}
.sact{position:absolute;top:0;bottom:0;width:96px;display:flex}
.sact.l{left:0}.sact.r{right:0}
.sdel{flex:1;border:0;background:#c0392b;color:#fff;font-weight:700}
.head .cur{margin-right:auto}
.selbar{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px}
.selbar[hidden]{display:none}
.selall{display:flex;align-items:center;gap:6px}
.bar .selall input{flex:none;width:18px;height:18px;padding:0;border:0;background:none}
.selacts{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chip:disabled{opacity:.45;cursor:default}
.ckb{display:inline-block;width:16px;height:16px;border:2px solid var(--sub);border-radius:4px;vertical-align:-3px;margin-right:8px;position:relative}
.ckb.on{background:var(--acc);border-color:var(--acc)}
.ckb.on::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.swrap .mail[aria-pressed="true"]{background:var(--sel)}
.read{position:relative}
.read h2{padding-right:52px}
.more{position:absolute;top:18px;right:18px;z-index:2}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px 0;display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu .chip{border:0;border-radius:0;padding:10px 14px;width:100%;text-align:left;font-size:14px}
.menu .chip:hover{background:var(--bg)}
.menu #purge,.menu #trashIt{color:#c0392b}
.accrow{display:flex;align-items:center;gap:8px;padding:4px 0}
.accrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accrow .chip{flex:none}
.sizeRow{display:flex;align-items:center;gap:10px}
.sizeRow input{width:auto;flex:1;padding:0;border:0;background:none;accent-color:var(--acc)}
@media (prefers-reduced-motion:reduce){.app>.side{transition:none}}
h1{font-size:18px;margin:4px 8px 16px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:8px;text-align:left}
.nav:hover{background:var(--bg)}
.nav[aria-pressed="true"]{background:var(--sel);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cnt{margin-left:auto;font-size:12px;color:var(--sub)}
.group{margin:18px 8px 6px;font-size:12px;color:var(--sub)}
.add{margin:14px 8px 0;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px 10px;width:calc(100% - 16px);color:var(--sub)}
.list{display:flex;flex-direction:column}
.bar{position:sticky;top:0;background:var(--panel);padding:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;z-index:1}
.bar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.chip{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--acc)}
.mail{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:4px solid transparent;background:none;padding:12px 14px}
.mail:hover{background:var(--bg)}
.mail[aria-current="true"]{background:var(--sel)}
.mail .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub)}
.mail .from{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .sub{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail.unread .sub,.mail.unread .from{font-weight:700;color:var(--ink)}
.mail .pre{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:32px 20px;color:var(--sub)}
.read{padding:28px 32px}
.read h2{font-size:21px;margin:0 0 8px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--sub);font-size:13px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tag{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.body{max-width:38em;white-space:pre-wrap}
.acts{margin-top:22px;display:flex;gap:8px}
.back{display:none}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(380px,90vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;margin:10px 0 4px;font-size:13px;color:var(--sub)}
dialog input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.note{font-size:12px;color:var(--sub);margin:12px 8px 0}
@media (max-width:820px){
.app{grid-template-columns:1fr}
.read{display:none;padding:18px}
.show-read .list{display:none}.show-read .read{display:block}
.back{display:inline-block;margin-bottom:12px}
}
</style>
</head>
<body class="locked">
<div class="app" id="app">
  <nav class="side" id="side" aria-label="アカウント">
    <h1>まとめてメール</h1>
    <div class="who" id="who"></div>
    <button class="nav" data-acc="all" aria-pressed="true"><span class="dot" style="background:var(--ink)"></span>すべての受信<span class="cnt" id="c-all"></span></button>
    <div class="group">アカウント</div>
    <div id="accs" style="display:contents"></div>
    <button class="add" id="addBtn">アカウントを追加</button>
    <div class="group">その他</div>
    <button class="nav" data-acc="trash" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 3.5h10M5.5 3.5V2h3v1.5M3.5 3.5l.6 8h5.8l.6-8"/></svg>ゴミ箱<span class="cnt" id="c-trash"></span></button>
    <button class="nav" id="setBtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4h10M2 10h10"/><circle cx="5" cy="4" r="1.6" fill="var(--panel)"/><circle cx="9" cy="10" r="1.6" fill="var(--panel)"/></svg>設定</button>
    <button class="nav" id="outBtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 2H2.5v10h3M9 4.5L11.5 7 9 9.5M11.5 7H5.5"/></svg>ログアウト</button>
    <p class="note">いまはデモ用のサンプルメールを表示しています。</p>
  </nav>
  <section class="list" aria-label="メール一覧">
    <div class="bar">
      <div class="head"><button class="chip" id="menuBtn" aria-label="メニューを開く" aria-expanded="false" aria-controls="side"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14"/></svg></button><span class="cur" id="cur"></span><button class="chip" id="emptyTrash" hidden>ゴミ箱を空にする</button><button class="chip" id="selBtn" aria-pressed="false">選択</button></div>
      <div class="selbar" id="selbar" hidden><label class="selall"><input type="checkbox" id="selAll"><span>すべて選択</span></label><span id="selCnt" style="color:var(--sub)"></span><span class="selacts" id="selActs"></span></div>
      <input id="q" type="search" placeholder="件名・差出人・本文で検索" aria-label="検索">
      <button class="chip" id="unreadOnly" aria-pressed="false">未読のみ</button>
    </div>
    <div id="mails"></div>
  </section>
  <article class="read" id="read" aria-live="polite"></article>
</div>

<div class="scrim" id="scrim"></div>
<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockT">
  <section class="home" id="home">
    <div class="peek" aria-hidden="true"><i style="--c:#d9453b"></i><i style="--c:#2f7de1"></i><i style="--c:#7a4fd0"></i><i style="--c:#1f9d6b"></i></div>
    <h1 class="hero">まとめてメール</h1>
    <p class="tag2">いろいろなメールを、ひとつの受信トレイで。</p>
    <div class="hbtns"><button class="chip go" id="toLogin">ログイン</button><button class="chip alt" id="toSignup">アカウントを作る</button></div>
    <p class="note">このデモでは、アカウント情報はこのブラウザの中にだけ保存されます。</p>
  </section>
  <form id="lockF" autocomplete="off" novalidate hidden>
    <h2 id="lockT"></h2>
    <p class="note" id="lockD" style="margin:0"></p>
    <label for="em">メールアドレス</label><input id="em" type="email" autocomplete="email">
    <label for="pw">パスワード</label><input id="pw" type="password">
    <div id="pw2w" hidden><label for="pw2">パスワード（確認）</label><input id="pw2" type="password"></div>
    <p class="err" id="lockE" role="alert"></p>
    <button class="chip go" id="lockB"></button>
    <button type="button" class="chip" id="lockBack" style="width:100%;margin-top:6px">戻る</button>
  </form>
</div>
<dialog id="accDlg">
  <strong>アカウントの編集</strong>
  <label for="accName">表示名</label><input id="accName" maxlength="30">
  <label for="accAddr">メールアドレス</label><input id="accAddr" type="email" autocomplete="off">
  <label>色</label><div class="sw" id="accSw"></div>
  <div class="row" style="justify-content:space-between"><button class="chip danger" id="accDel">削除</button><span style="display:flex;gap:8px"><button class="chip" id="accCancel">キャンセル</button><button class="chip" id="accSave" style="background:var(--sel)">保存</button></span></div>
</dialog>
<dialog id="cfmDlg">
  <strong id="cfmT"></strong>
  <p class="note" id="cfmD" style="margin:10px 0 0"></p>
  <div class="row"><button class="chip" id="cfmNo">キャンセル</button><button class="chip danger" id="cfmYes"></button></div>
</dialog>
<dialog id="setDlg">
  <strong>設定</strong>
  <label>テーマ</label>
  <div class="seg" id="segTheme"><button class="chip" data-v="auto">自動</button><button class="chip" data-v="light">ライト</button><button class="chip" data-v="dark">ダーク</button></div>
  <label>言語</label>
  <div class="seg" id="segLang"><button class="chip" data-v="ja">日本語</button><button class="chip" data-v="en">English</button></div>
  <label>文字の大きさ</label>
  <div class="sizeRow"><span aria-hidden="true" style="font-size:12px">あ</span><input type="range" id="sizeR" min="12" max="22" step="1" aria-label="文字の大きさ"><span aria-hidden="true" style="font-size:20px">あ</span><span id="sizeV" style="min-width:3.2em;text-align:right;font-size:13px;color:var(--sub)"></span></div>
  <label>アカウント</label>
  <div id="setAccs"></div>
  <p class="note" style="margin:8px 0 0">アカウントの名前や色は、メニューの…から変えられます。</p>
  <div class="row"><button class="chip" id="setClose">閉じる</button></div>
</dialog>
<dialog id="dlg">
  <form method="dialog" id="f">
    <strong>アカウントを追加</strong>
    <label for="an">表示名</label><input id="an" required placeholder="例: 学校のメール">
    <label for="ad">メールアドレス</label><input id="ad" type="email" required placeholder="you@example.com">
    <p class="note" style="margin:10px 0 0">追加すると、このデモでは空のアカウントとして一覧に加わります。</p>
    <div class="row"><button type="button" class="chip" id="cancel">キャンセル</button><button class="chip" style="background:var(--sel)">追加する</button></div>
  </form>
</dialog>

<script>
var COLORS=["#d9453b","#2f7de1","#7a4fd0","#1f9d6b","#d98a1a","#c43c8d"];
var accounts=[

];
try{var sa=JSON.parse(localStorage.getItem("mailAccs")||"null");if(Array.isArray(sa))accounts=sa}catch(e){}
var mails=[
 {id:1,a:"w",from:"佐藤 健",sub:"明日の打ち合わせについて",t:"10/25 09:12",body:"田中さん\n\nお疲れさまです。明日14時からの打ち合わせですが、会議室Bに変更になりました。\n資料は事前に共有フォルダへ入れておきます。\n\n佐藤",u:1},

];

function filtered(){var q=st.q.toLowerCase();return mails.filter(function(m){
 if(m.d===2||!acc(m.a))return false;

 sw.dx=dx;posSw(sw.el,Math.max(-96,Math.min(96,sw.base+dx)),false)});
function endSw(e){if(!sw||e.pointerId!==sw.id)return;var s=sw;sw=null;if(!s.on)return;swiped=true;
 var x=Math.max(-96,Math.min(96,s.base+s.dx)),off=Math.abs(x)>=48?(x<0?-88:88):0;
 posSw(s.el,off,true);s.el.dataset.off=off;openRow=off?s.el:null}
$("#mails").addEventListener("pointerup",endSw);$("#mails").addEventListener("pointercancel",endSw);
document.addEventListener("click",function(e){if(swiped){swiped=false;e.stopPropagation();e.preventDefault();return}
 if(e.target.closest(".sdel"))return;
 if(openRow){var onRow=e.target.closest(".mail");closeSwipe();if(onRow){e.stopPropagation();e.preventDefault()}}},true);
$("#mails").addEventListener("click",function(e){var d=e.target.closest(".sdel");if(!d)return;var id=+d.dataset.del,m=mails.filter(function(k){return k.id===id})[0];if(!m)return;
 if(st.acc==="trash"){confirmBox(t("完全に削除しますか？"),t("この操作は元に戻せません。"),t("完全に削除"),function(){m.d=2;saveD();if(st.sel===id)closeRead();all()})}
 else{m.d=1;saveD();if(st.sel===id)closeRead();all()}});
function selIds(){return filtered().map(function(m){return m.id})}
function renderSelUI(){var on=st.selMode,ids=selIds(),n=ids.filter(function(i){return picked[i]}).length,sb=$("#selBtn");
 $("#selbar").hidden=!on;sb.textContent=t(on?"完了":"選択");sb.setAttribute("aria-pressed",on);
 if(!on)return;
 var ca=$("#selAll");ca.checked=ids.length>0&&n===ids.length;ca.indeterminate=n>0&&n<ids.length;ca.disabled=!ids.length;
 $("#selCnt").textContent=set.lang==="en"?n+" selected":n+"件選択中";
 var L=st.acc==="trash"?[["restore","元に戻す"],["purge","完全に削除"]]:[["read","既読にする"],["unread","未読に戻す"],["trash","ゴミ箱に移す"]];
 $("#selActs").innerHTML=L.map(function(x){return '<button class="chip'+(x[0]==="purge"?' danger':'')+'" data-bulk="'+x[0]+'"'+(n?'':' disabled')+'>'+t(x[1])+'</button>'}).join("")}
function togglePick(id){if(picked[id])delete picked[id];else picked[id]=1;renderList();renderSelUI()}
function bulk(k,ms){ms.forEach(function(m){if(k==="read")m.u=0;else if(k==="unread")m.u=1;else if(k==="trash")m.d=1;else if(k==="restore")m.d=0;else if(k==="purge")m.d=2});
 if(k!=="read"&&k!=="unread"&&ms.some(function(m){return m.id===st.sel}))closeRead();picked={};save();saveD();all()}
$("#selBtn").addEventListener("click",function(){st.selMode=!st.selMode;if(!st.selMode)picked={};closeSwipe();all()});
$("#selAll").addEventListener("change",function(e){selIds().forEach(function(i){if(e.target.checked)picked[i]=1;else delete picked[i]});renderList();renderSelUI()});
$("#selActs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b||b.disabled)return;var k=b.dataset.bulk,ids=selIds().filter(function(i){return picked[i]}),ms=mails.filter(function(m){return ids.indexOf(m.id)>-1});if(!ms.length)return;
 if(k==="purge"){var c=ms.length;confirmBox(set.lang==="en"?"Delete "+c+" emails permanently?":c+"件を完全に削除しますか？",t("この操作は元に戻せません。"),t("完全に削除"),function(){bulk(k,ms)})}
 else bulk(k,ms)});
var mm=false,trOpenId=null;
document.addEventListener("click",function(e){if(!mm)return;if(e.target.closest("#moreBtn"))return;mm=false;var mn=$("#moreMenu");if(mn)mn.hidden=true;var mb=$("#moreBtn");if(mb)mb.setAttribute("aria-expanded","false")},true);
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.id==="moreBtn"){mm=!mm;renderRead()}
 else if(b.id==="trOpen"){var m=curMail();if(!m)return;trOpenId=m.id;if(trans[m.id+"|"+(tlang||set.lang)]===undefined)doTranslate();else renderRead()}
 else if(b.id==="trClose"){trOpenId=null;renderRead()}});
$("#setDlg").addEventListener("input",function(e){if(e.target.id==="sizeR"){set.size=e.target.value;applySet()}});
function setMenu(o){document.body.classList.toggle("menu-open",o);var b=$("#menuBtn");b.setAttribute("aria-expanded",o);b.setAttribute("aria-label",t(o?"メニューを閉じる":"メニューを開く"))}
$("#menuBtn").addEventListener("click",function(){setMenu(!document.body.classList.contains("menu-open"))});
$("#scrim").addEventListener("click",function(){setMenu(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){setMenu(false);if(mm){mm=false;renderRead()}}});
all();
</script>
</body>
</html>
