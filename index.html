<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まとめてメール</title>
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#16202e;--sub:#5d6b7e;--line:#d9e0e8;--sel:#e3edfb;--acc:#2456c9}
@media (prefers-color-scheme:dark){:root{--bg:#111821;--panel:#1a2430;--ink:#e8edf3;--sub:#98a6b8;--line:#2b3846;--sel:#223652;--acc:#7aa5ff}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{border:1px solid var(--line);background:none;border-radius:8px;padding:7px 12px}
.btn[aria-pressed="true"]{background:var(--sel);border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);padding:11px 16px;font-weight:700;width:100%}
.btn.danger{color:#c0392b;border-color:#c0392b}
.note{font-size:12px;color:var(--sub)}
#login{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(380px,100%);text-align:center}
.card h1{margin:0 0 6px;font-size:28px}
.warn{font-size:13px;color:#c0392b;text-align:left;background:var(--bg);border-radius:8px;padding:10px 12px}
#appw{flex:1;min-height:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:10}
.top h1{margin:0;font-size:18px}
.amw{position:relative}
.avatar{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--sub);background:none;font-size:13px;font-weight:700;padding:0}
.apop{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.22);padding:16px;z-index:30}
.apop b{display:block;font-size:17px}
.apop .sub{color:var(--sub);font-size:13px;overflow-wrap:anywhere;margin-bottom:10px}
.apop .btn{display:block;width:100%;text-align:left;margin-top:6px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr;gap:1px;background:var(--line)}
.app>*{background:var(--panel);overflow:auto;min-height:0}
.bar{position:sticky;top:0;background:var(--panel);padding:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;z-index:1}
.tabs{display:flex;gap:6px;flex-basis:100%}
.bar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}
.mail{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:4px solid var(--acc);background:none;padding:11px 14px}
.mail:hover{background:var(--bg)}
.mail.cur{background:var(--sel)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub)}
.from,.sub,.pre{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .pre{font-size:13px;color:var(--sub)}
.mail.unread .from,.mail.unread .sub{font-weight:700;color:var(--ink)}
.star{cursor:pointer;margin-left:6px;font-size:15px}
.star.on{color:#e0a100}
.empty{padding:28px 20px;color:var(--sub)}
.read{padding:26px 30px}
.read h2{margin:0 0 8px;font-size:21px;line-height:1.4}
.meta{color:var(--sub);font-size:13px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-wrap:anywhere}
.body{max-width:40em;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.back{display:none;margin-bottom:12px}
#more{margin:12px;width:calc(100% - 24px)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
@media (max-width:820px){.app{grid-template-columns:1fr}.read{display:none;padding:18px}.show-read .list{display:none}.show-read .read{display:block}.back{display:inline-block}}
</style>
</head>
<body>
<main id="login" hidden>
  <div class="card">
    <h1>まとめてメール</h1>
    <p>Outlookのメールを、この画面で読めます。</p>
    <button class="btn pri" id="loginBtn">Microsoftでログイン</button>
    <p class="warn" id="setupMsg" hidden>設定が必要です。index.html の先頭にある CLIENT_ID に、Microsoft Entraで作ったアプリのクライアントIDを貼ってください。</p>
    <p class="note">メールは、あなたのブラウザとMicrosoftの間だけでやり取りされます。</p>
  </div>
</main>
<div id="appw" hidden>
  <header class="top">
    <h1>まとめてメール</h1>
    <div class="amw" id="amw">
      <button class="avatar" id="avBtn" aria-haspopup="dialog" aria-expanded="false" aria-label="アカウント"></button>
      <div class="apop" id="apop" role="dialog" aria-label="アカウント" hidden>
        <b id="pName"></b><div class="sub" id="pMail"></div>
        <button class="btn" id="switchBtn">別のアカウントでログインする</button>
        <button class="btn" id="outBtn">ログアウト</button>
      </div>
    </div>
  </header>
  <div class="app" id="app">
    <section class="list" aria-label="メール一覧">
      <div class="bar">
        <div class="tabs" id="tabs"><button class="btn" data-v="inbox">受信トレイ</button><button class="btn" data-v="fav">お気に入り</button><button class="btn" data-v="trash">ゴミ箱</button></div>
        <input id="q" type="search" placeholder="読み込み済みのメールを検索" aria-label="検索">
        <button class="btn" id="unreadOnly" aria-pressed="false">未読のみ</button>
        <button class="btn" id="reload">更新</button>
      </div>
      <div id="mails"></div>
      <button class="btn" id="more" hidden>さらに読み込む</button>
    </section>
    <article class="read" id="read" aria-live="polite"></article>
  </div>
</div>
<div id="toast" role="status"></div>
<script>
/* ===== 設定: Microsoft Entraで作ったアプリのクライアントIDを貼る ===== */
const CLIENT_ID="ここにクライアントIDを貼る";
const SCOPES="User.Read Mail.ReadWrite offline_access";
const REDIRECT=location.origin+location.pathname;
const AUTH="https://login.microsoftonline.com/common/oauth2/v2.0";
const SEL="id,subject,from,receivedDateTime,bodyPreview,isRead,flag";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
let tok=null,me=null,view="inbox",items=[],next=null,sel=null,q="",unreadOnly=false,loading=false;const bodies={};
try{tok=JSON.parse(localStorage.getItem("tok")||"null")}catch(e){}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),4000)}

/* ---- ログイン (PKCE) ---- */
async function login(){
  const v=b64(crypto.getRandomValues(new Uint8Array(32))),st=b64(crypto.getRandomValues(new Uint8Array(12)));
  const c=b64(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  sessionStorage.setItem("pkce",JSON.stringify({v,st}));
  location.href=AUTH+"/authorize?"+new URLSearchParams({client_id:CLIENT_ID,response_type:"code",redirect_uri:REDIRECT,response_mode:"query",scope:SCOPES,code_challenge:c,code_challenge_method:"S256",state:st,prompt:"select_account"});
}
async function tokenReq(p){
  const r=await fetch(AUTH+"/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CLIENT_ID,scope:SCOPES,...p})});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error);
  tok={at:j.access_token,rt:j.refresh_token||(tok&&tok.rt),exp:Date.now()+j.expires_in*1000-60000};
  localStorage.setItem("tok",JSON.stringify(tok));
}
async function getToken(){
  if(!tok)throw new Error("login");
  if(tok.exp>Date.now())return tok.at;
  if(!tok.rt)throw new Error("login");
  try{await tokenReq({grant_type:"refresh_token",refresh_token:tok.rt})}catch(e){throw new Error("login")}
  return tok.at;
}
async function handleRedirect(){
  const p=new URLSearchParams(location.search);if(!p.has("code")&&!p.has("error"))return;
  const s=JSON.parse(sessionStorage.getItem("pkce")||"{}");history.replaceState(null,"",REDIRECT);
  if(p.get("error"))throw new Error(p.get("error_description")||p.get("error"));
  if(p.get("state")!==s.st)throw new Error("もう一度ログインしてください。");
  await tokenReq({grant_type:"authorization_code",code:p.get("code"),redirect_uri:REDIRECT,code_verifier:s.v});
  sessionStorage.removeItem("pkce");
}
function logout(){tok=null;me=null;items=[];sel=null;localStorage.removeItem("tok");for(const k in bodies)delete bodies[k];showLogin()}
function showLogin(){$("#appw").hidden=true;$("#login").hidden=false;$("#setupMsg").hidden=/^[0-9a-f-]{36}$/i.test(CLIENT_ID)}

/* ---- Microsoft Graph ---- */
async function g(path,opt={}){
  const t=await getToken();
  const r=await fetch(path.startsWith("http")?path:"https://graph.microsoft.com/v1.0"+path,{...opt,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"}});
  if(r.status===204)return null;
  const j=await r.json().catch(()=>null);
  if(r.status===401)throw new Error("login");
  if(!r.ok)throw new Error((j&&j.error&&j.error.message)||("エラー "+r.status));
  return j;
}
function err(e){if(e.message==="login"){logout();toast("ログインの有効期限が切れました。もう一度ログインしてください。")}else toast(e.message)}
const find=id=>items.find(m=>m.id===id);
const isFav=m=>m.flag&&m.flag.flagStatus==="flagged";
const sender=m=>{const a=m.from&&m.from.emailAddress;return a?(a.name||a.address):"（差出人なし）"};
function toText(b){
  if(!b)return"";if(b.contentType!=="html")return b.content;
  const h=b.content.replace(/<(style|script|head)[\s\S]*?<\/\1>/gi,"").replace(/<br\s*\/?>/gi,"\n").replace(/<\/(p|div|li|tr|h\d)>/gi,"\n");
  return new DOMParser().parseFromString(h,"text/html").body.textContent.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}

/* ---- 一覧 ---- */
async function load(more){
  if(loading)return;loading=true;
  try{
    let u;
    if(more&&next)u=next;
    else if(view==="fav")u="/me/messages?$top=50&$filter="+encodeURIComponent("flag/flagStatus eq 'flagged'")+"&$select="+SEL;
    else u="/me/mailFolders/"+(view==="trash"?"deleteditems":"inbox")+"/messages?$top=50&$orderby=receivedDateTime desc&$select="+SEL;
    const j=await g(u);
    items=(more?items:[]).concat(j.value);next=j["@odata.nextLink"]||null;
    if(view==="fav")items.sort((a,b)=>b.receivedDateTime.localeCompare(a.receivedDateTime));
  }catch(e){err(e)}
  loading=false;renderList();
}
function shown(){const k=q.toLowerCase();return items.filter(m=>(!unreadOnly||!m.isRead)&&(!k||(m.subject+sender(m)+m.bodyPreview).toLowerCase().includes(k)))}
function renderList(){
  document.querySelectorAll("#tabs .btn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===view));
  const l=shown();
  $("#mails").innerHTML=l.length?l.map(m=>`<button class="mail${m.isRead?"":" unread"}${sel===m.id?" cur":""}" data-id="${esc(m.id)}"><div class="row"><span class="from">${esc(sender(m))}</span><span>${fmt(m.receivedDateTime)}<span class="star${isFav(m)?" on":""}" role="button" tabindex="0" aria-label="お気に入り" aria-pressed="${isFav(m)}" data-fav="${esc(m.id)}">${isFav(m)?"★":"☆"}</span></span></div><div class="sub">${esc(m.subject||"（件名なし）")}</div><div class="pre">${esc(m.bodyPreview)}</div></button>`).join(""):`<p class="empty">${loading?"読み込み中…":view==="fav"?"お気に入りはまだありません。メールの☆を押すと追加できます。":"メールはありません。"}</p>`;
  $("#more").hidden=!next;
}

/* ---- 本文 ---- */
function paintRead(m){
  const r=$("#read");
  if(!m){r.innerHTML='<p class="empty">一覧からメールを選ぶと、ここに内容が表示されます。</p>';return}
  const t=view==="trash";
  r.innerHTML=`<button class="btn back" id="back">一覧に戻る</button><h2>${esc(m.subject||"（件名なし）")}</h2><div class="meta">差出人: ${esc(sender(m))}${m.from&&m.from.emailAddress?" &lt;"+esc(m.from.emailAddress.address)+"&gt;":""}<br>${fmt(m.receivedDateTime)}</div><div class="body">${bodies[m.id]==null?"読み込み中…":esc(bodies[m.id])}</div><div class="acts"><button class="btn" data-a="fav">${isFav(m)?"★ お気に入りを解除":"☆ お気に入りに追加"}</button><button class="btn" data-a="read">${m.isRead?"未読に戻す":"既読にする"}</button>${t?'<button class="btn" data-a="restore">受信トレイに戻す</button><button class="btn danger" data-a="purge">完全に削除</button>':'<button class="btn danger" data-a="trash">ゴミ箱に移す</button>'}</div>`;
}
async function open(id){
  sel=id;$("#app").classList.add("show-read");renderList();const m=find(id);paintRead(m);
  if(bodies[id]==null){
    try{const j=await g("/me/messages/"+encodeURIComponent(id)+"?$select=body");bodies[id]=toText(j.body)}catch(e){bodies[id]="（本文を読み込めませんでした）";err(e)}
    if(sel===id)paintRead(m);
  }
  if(!m.isRead)setRead(m,true);
}
function closeRead(){sel=null;$("#app").classList.remove("show-read");paintRead(null)}

/* ---- 操作 ---- */
const patch=(m,b)=>g("/me/messages/"+encodeURIComponent(m.id),{method:"PATCH",body:JSON.stringify(b)});
async function setRead(m,v){const o=m.isRead;m.isRead=v;renderList();if(sel===m.id)paintRead(m);try{await patch(m,{isRead:v})}catch(e){m.isRead=o;renderList();if(sel===m.id)paintRead(m);err(e)}}
async function toggleFav(m){const o=m.flag;m.flag={flagStatus:isFav(m)?"notFlagged":"flagged"};renderList();if(sel===m.id)paintRead(m);try{await patch(m,{flag:m.flag})}catch(e){m.flag=o;renderList();if(sel===m.id)paintRead(m);err(e)}}
async function moveTo(m,dest,msg){try{await g("/me/messages/"+encodeURIComponent(m.id)+"/move",{method:"POST",body:JSON.stringify({destinationId:dest})});items=items.filter(x=>x.id!==m.id);if(sel===m.id)closeRead();renderList();toast(msg)}catch(e){err(e)}}
async function purge(m){if(!confirm("このメールを完全に削除しますか？元に戻せません。"))return;try{await g("/me/messages/"+encodeURIComponent(m.id),{method:"DELETE"});items=items.filter(x=>x.id!==m.id);if(sel===m.id)closeRead();renderList();toast("削除しました。")}catch(e){err(e)}}

/* ---- イベント ---- */
$("#loginBtn").onclick=()=>{if($("#setupMsg").hidden)login()};
$("#tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;view=b.dataset.v;items=[];next=null;closeRead();renderList();load()};
$("#q").oninput=e=>{q=e.target.value;renderList()};
$("#unreadOnly").onclick=e=>{unreadOnly=!unreadOnly;e.currentTarget.setAttribute("aria-pressed",unreadOnly);renderList()};
$("#reload").onclick=()=>load();
$("#more").onclick=()=>load(true);
$("#mails").onclick=e=>{const s=e.target.closest("[data-fav]");if(s){e.stopPropagation();const m=find(s.dataset.fav);if(m)toggleFav(m);return}const b=e.target.closest(".mail");if(b)open(b.dataset.id)};
$("#mails").onkeydown=e=>{const s=e.target.closest("[data-fav]");if(s&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const m=find(s.dataset.fav);if(m)toggleFav(m)}};
$("#read").onclick=e=>{
  if(e.target.closest("#back")){closeRead();renderList();return}
  const b=e.target.closest("[data-a]");if(!b)return;const m=find(sel);if(!m)return;const a=b.dataset.a;
  if(a==="fav")toggleFav(m);else if(a==="read")setRead(m,!m.isRead);
  else if(a==="trash")moveTo(m,"deleteditems","ゴミ箱に移しました。");
  else if(a==="restore")moveTo(m,"inbox","受信トレイに戻しました。");
  else if(a==="purge")purge(m);
};
const setAp=o=>{$("#apop").hidden=!o;$("#avBtn").setAttribute("aria-expanded",o)};
$("#avBtn").onclick=()=>setAp($("#apop").hidden);
document.addEventListener("click",e=>{if(!e.target.closest("#amw"))setAp(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")setAp(false)});
$("#outBtn").onclick=()=>{setAp(false);if(confirm("ログアウトしますか？"))logout()};
$("#switchBtn").onclick=()=>{setAp(false);if(confirm("ログアウトして、別のアカウントでログインしますか？")){logout();login()}};

/* ---- 起動 ---- */
async function start(){
  me=await g("/me?$select=displayName,mail,userPrincipalName");
  const name=me.displayName||me.mail||me.userPrincipalName||"";
  $("#avBtn").textContent=Array.from(name).slice(0,2).join("").toUpperCase();
  $("#pName").textContent=name;$("#pMail").textContent=me.mail||me.userPrincipalName||"";
  $("#login").hidden=true;$("#appw").hidden=false;paintRead(null);renderList();await load();
}
(async()=>{
  try{await handleRedirect()}catch(e){toast("ログインできませんでした: "+e.message)}
  if(!tok){showLogin();return}
  try{await start()}catch(e){if(e.message==="login")showLogin();else{showLogin();toast(e.message)}}
})();
</script>
</body>
</html>
